services:
  db:
    image: postgres:16
    ports:
      - "55432:5432"
    environment:
      POSTGRES_DB: meridian_trips
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian_trips"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  ingest:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://meridian:meridian@db:5432/meridian_trips
      REGION: JC
      TARGET_MONTH: 2025-12
    volumes:
      - ./data/raw_bronze:/data/raw_bronze
    restart: "no"  # ← KEY: Don't restart after exit
    profiles:
      - "ingest" 

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data: